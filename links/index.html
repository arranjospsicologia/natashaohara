    <script>
        // Descobre de onde a pessoa veio, sem depender só do UTM:
        // 1) UTM do link (o Instagram adiciona utm_source=ig sozinho na bio)
        // 2) navegador embutido do app (o do Instagram se identifica como "Instagram")
        // 3) site anterior (referrer)
        function detectarOrigem() {
            var params = new URLSearchParams(window.location.search);
            var src = (params.get('utm_source') || '').toLowerCase();
            var ua = navigator.userAgent || '';
            var ref = document.referrer || '';

            if (src === 'ig' || src === 'instagram' || /Instagram/i.test(ua) || /instagram\.com/i.test(ref)) return 'instagram';
            if (src === 'fb' || src === 'facebook' || /FBAN|FBAV|FB_IAB/.test(ua) || /facebook\.com/i.test(ref)) return 'facebook';
            if (src === 'whatsapp' || /WhatsApp/i.test(ua) || /wl\.co|whatsapp/i.test(ref)) return 'whatsapp';
            if (src) return src;
            if (ref) {
                try { return new URL(ref).hostname.replace(/^www\./, ''); } catch (e) {}
            }
            return 'direct';
        }

        var origem = detectarOrigem();

        // Visita à página de links (evento links_view, parâmetro visit_source)
        if (typeof gtag !== 'undefined') {
            gtag('event', 'links_view', { visit_source: origem });
        }

        // Cliques nos botões viram eventos no GA4 (whatsapp_click / site_click)
        document.querySelectorAll('[data-track]').forEach(function (link) {
            link.addEventListener('click', function () {
                if (typeof gtag === 'undefined') return;
                gtag('event', link.dataset.track, {
                    link_location: 'pagina_links',
                    link_text: link.textContent.trim(),
                    visit_source: origem
                });
            });
        });
    </script>
